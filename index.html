<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ヤンソン</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f13;
      font-family: 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif;
      color: #e8e8f0;
      padding: 24px;
    }

    /* ---- カード ---- */
    .card {
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);

      opacity: 0;
      transform: translateY(28px);
      animation: fadeUp 0.7s ease forwards;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ---- アバター ---- */
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0 auto 24px;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.15s forwards;
    }

    /* ---- YouTube埋め込み ---- */
    .youtube-wrap {
      margin-top: 28px;
      border-radius: 12px;
      overflow: hidden;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.55s forwards;
    }

    .youtube-wrap iframe {
      display: block;
      width: 100%;
      height: 220px;
      border: none;
    }

    /* ---- 名前・肩書き ---- */
    .name {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #f0f0ff;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.25s forwards;
    }

    .title {
      margin-top: 6px;
      font-size: 0.9rem;
      font-weight: 400;
      color: #8888aa;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.35s forwards;
    }

    /* ---- 区切り線 ---- */
    .divider {
      margin: 28px auto;
      width: 48px;
      height: 2px;
      background: linear-gradient(90deg, #7c5cbf, #4ea8de);
      border-radius: 2px;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.42s forwards;
    }

    /* ---- 自己紹介 ---- */
    .bio {
      font-size: 0.95rem;
      line-height: 1.8;
      color: #b0b0cc;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.5s forwards;
    }

    /* ---- SNSボタン ---- */
    .sns-list {
      list-style: none;
      margin-top: 36px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sns-list li {
      opacity: 0;
    }
    .sns-list li:nth-child(1) { animation: fadeUp 0.7s ease 0.6s forwards; }
    .sns-list li:nth-child(2) { animation: fadeUp 0.7s ease 0.7s forwards; }
    .sns-list li:nth-child(3) { animation: fadeUp 0.7s ease 0.8s forwards; }

    .sns-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      border: 1px solid transparent;
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }

    .sns-btn:hover {
      transform: translateY(-2px);
    }

    .sns-btn--x {
      background: #111;
      border-color: #333;
      color: #e8e8f0;
    }
    .sns-btn--x:hover {
      background: #1c1c1c;
      border-color: #555;
    }

    .sns-btn--youtube {
      background: #1a0a0a;
      border-color: #5c1a1a;
      color: #ff4e4e;
    }
    .sns-btn--youtube:hover {
      background: #250f0f;
      border-color: #c0392b;
    }

    .sns-btn--twitch {
      background: #12091e;
      border-color: #3a1a6e;
      color: #bf94ff;
    }
    .sns-btn--twitch:hover {
      background: #1a1030;
      border-color: #6441a5;
    }

    .sns-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    /* ---- レスポンシブ ---- */
    @media (max-width: 480px) {
      .card {
        padding: 36px 24px;
      }
      .name {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">

    <img class="avatar" src="https://pbs.twimg.com/profile_images/1763238234442829824/a94mRDn8_400x400.jpg" alt="ヤンソン">

    <h1 class="name">ヤンソン</h1>
    <p class="title">配信者・動画クリエイター</p>

    <div class="divider"></div>

    <p class="bio">
      ポジティブ配信好きな方は楽しんでもらえると思います！<br>
      最近はTFTばっかりやってます（2026年5月現在）
    </p>

    <div class="youtube-wrap">
      <iframe id="youtube-frame" src="" allowfullscreen title="ヤンソン - 最新動画"></iframe>
    </div>

    <script>
      fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent('https://www.youtube.com/feeds/videos.xml?channel_id=UCBRK0ZEOf7ZCmAknLsiHpsQ'))
        .then(r => r.json())
        .then(data => {
          const id = new URL(data.items[0].link).searchParams.get('v');
          document.getElementById('youtube-frame').src = 'https://www.youtube.com/embed/' + id;
        })
        .catch(() => {});
    </script>

    <ul class="sns-list">

      <li>
        <a class="sns-btn sns-btn--x" href="https://x.com/yanson_harapeco" target="_blank" rel="noopener noreferrer">
          <svg class="sns-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.402 6.231H2.742l7.73-8.835L1.254 2.25H8.08l4.261 5.636 5.903-5.636Zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
          X (Twitter)
        </a>
      </li>

      <li>
        <a class="sns-btn sns-btn--youtube" href="https://www.youtube.com/@yanson_harapeco" target="_blank" rel="noopener noreferrer">
          <svg class="sns-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
          </svg>
          YouTube
        </a>
      </li>

      <li>
        <a class="sns-btn sns-btn--twitch" href="https://www.twitch.tv/yanson_harapeco" target="_blank" rel="noopener noreferrer">
          <svg class="sns-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/>
          </svg>
          Twitch
        </a>
      </li>

    </ul>
  </div>
</body>
</html>
